version: "3.9"

services:
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  frontend_node_modules:
  backend_node_modules:
